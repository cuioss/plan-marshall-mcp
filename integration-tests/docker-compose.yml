# Integration-test topology: the plan-marshall-mcp image, built from the application module.
services:
  plan-marshall-mcp:
    image: "plan-marshall-mcp:jvm"
    build:
      context: ../plan-marshall-mcp
      dockerfile: src/main/docker/Dockerfile.jvm
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_REVISION: ${APP_REVISION:-dev}
    ports:
      - "18080:8080"
      - "19000:9000"
    # No 'healthcheck:' key on purpose: it would replace the image's own HEALTHCHECK,
    # which ContainerHealthIT verifies.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - plan-marshall-mcp

networks:
  plan-marshall-mcp:
    driver: bridge
