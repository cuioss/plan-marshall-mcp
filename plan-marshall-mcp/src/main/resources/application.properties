quarkus.application.name=plan-marshall-mcp

# Application traffic (MCP Streamable HTTP endpoint at /mcp)
quarkus.http.port=8080
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.server-info.name=plan-marshall-mcp

# Management interface: /q/health on port 9000 (probed by the image HEALTHCHECK, see HealthProbe)
quarkus.management.enabled=true
quarkus.management.port=9000

# The TokenSheriff extensions register unqualified health and metrics beans that are not
# wanted until PM-MCP is configured as an OAuth resource / client (as in API-Sheriff).
quarkus.arc.exclude-types=de.cuioss.sheriff.token.quarkus.health.*,de.cuioss.sheriff.token.quarkus.metrics.*

# Logging
quarkus.log.level=INFO
quarkus.log.category."de.cuioss.pm".level=INFO
