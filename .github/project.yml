# yaml-language-server: $schema=https://raw.githubusercontent.com/cuioss/cuioss-organization/main/.github/actions/read-project-config/schema.json
name: plan-marshall-mcp
description: Local MCP server that takes over plan-marshall's process logic via a hypermedia-driven workflow

# Publishing is disabled: there is no release workflow, no snapshot deploy, no GitHub release and no
# Pages deploy. The version values below are informational only.
release:
  current-version: 0.1.0
  next-version: 0.1.1-SNAPSHOT
  create-github-release: false

maven-build:
  java-versions: '["25","26"]'
  java-version: '25'
  enable-snapshot-deploy: false
  maven-profiles-snapshot: 'release-snapshot,javadoc'
  maven-profiles-release: 'release,javadoc'
  npm-cache: false

sonar:
  project-key: cuioss_plan-marshall-mcp
  enabled: true
  skip-on-dependabot: true

pages:
  reference: plan-marshall-mcp
  deploy-at-release: false

github-automation:
  auto-merge-build-versions: true
