# Dependabot version updates, see
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# Cooldown: semver-* keys are only valid for maven; github-actions and docker take default-days only.

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: "/plan-marshall-mcp/src/main/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
