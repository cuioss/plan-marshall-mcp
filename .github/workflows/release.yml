# Configuration is read from .github/project.yml - no inputs needed!
#
# MERGING A CHANGE OF release.current-version IN .github/project.yml IS A RELEASE.
# The central version-changed guard inside the pinned cuioss-organization workflow publishes to
# Maven Central whenever current-version differs from the merge commit's first parent and is
# untagged. That is how 0.1.0 was cut unintentionally: the bootstrap PR (#2) moved the value
# inherited from cui-java-module-template (1.0.0) to 0.1.0, and the guard read that as a version
# bump. Only change current-version through the release runbook (.claude/skills/release/SKILL.md).
name: Release

on:
  workflow_dispatch:
  # PREFILTER ONLY, NEVER THE DECISION: this matches every edit to .github/project.yml. The central
  # guard decides; `branches:` (the PR's base) keeps merges into other branches out entirely.
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['.github/project.yml']

permissions:
  contents: read

jobs:
  release:
    # Both operands are ANDed with the central guard, never an alternative to it. The first confines
    # a dispatch (which takes no branch filter) to main; the second skips a close without merge.
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    permissions:
      contents: write
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-release.yml@bb77fb40cd78606e630f0c2c856ff6d224203ac9 # v0.29.0
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
      OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
