# TEMPORARY, for one run: a build from an empty local repository with Maven transfer output, to show which host
# every request for a coordinate goes to. Removed again in this pull request.
name: Transfer output (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transfer-output:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with transfer output
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The runner sets MAVEN_ARGS=-ntp, which hides the artifact transfers
          MAVEN_ARGS: ''
        run: |
          echo "entries in ~/.m2/repository before the build: $(ls ~/.m2/repository 2>/dev/null | wc -l)"
          ./mvnw -B -Dmaven.repo.local="$RUNNER_TEMP/empty-repo" verify -DskipTests > build.log 2>&1 || { tail -60 build.log; exit 1; }
      - name: Where the requests went
        run: |
          grep -E "Downloading from " build.log | sed -E 's/^\[INFO\] //' > requests.txt
          echo "--- requests in total, by repository id:"
          sed -E 's/^Downloading from ([a-z-]+): (https?:\/\/[^\/]+)\/.*/\1 \2/' requests.txt | sort | uniq -c
          echo "--- requests for a de.planmarshall coordinate, by host:"
          grep "/de/planmarshall/" requests.txt | sed -E 's/^Downloading from ([a-z-]+): (https?:\/\/[^\/]+)\/.*/\1 \2/' | sort | uniq -c
          echo "--- requests for a de.planmarshall coordinate to a host other than maven.pkg.github.com: $(grep "/de/planmarshall/" requests.txt | grep -vc "https://maven.pkg.github.com/")"
          echo "--- requests to maven.pkg.github.com for another group: $(grep "https://maven.pkg.github.com/" requests.txt | grep -vc "/de/planmarshall/")"
          echo "--- every request for the parent POM, in order:"
          grep -n "pm-mcp-parent" requests.txt
          echo "--- every request for a de.planmarshall release (no SNAPSHOT in the path), in order:"
          grep "/de/planmarshall/" requests.txt | grep -v "SNAPSHOT" | grep -n ""
          grep -E "BUILD" build.log
