# TEMPORARY, for one run: a build with Maven transfer output, to show that the parent POM and the SNAPSHOT
# modules are downloaded from the organisation registry with the workflow token. Removed again in this pull
# request; the regular workflows run Maven with --no-transfer-progress.
name: Transfer output (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transfer-output:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with transfer output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "entries in ~/.m2/repository before the build: $(ls ~/.m2/repository 2>/dev/null | wc -l)"
          ./mvnw -B -Dmaven.repo.local="$RUNNER_TEMP/empty-repo" verify -DskipTests > build.log 2>&1 || { tail -50 build.log; exit 1; }
      - name: Downloads from the organisation registry
        run: |
          grep -E "Downloaded from " build.log | grep -E "planmarshall" | grep -vE "maven-metadata" || { echo "no download of a de.planmarshall artifact found"; exit 1; }
          echo "--- downloads per repository id:"
          grep -oE "Downloaded from [a-z-]+" build.log | sort | uniq -c
          echo "--- requests for de.planmarshall to a repository other than plan-marshall:"
          grep -E "Download(ing|ed) from " build.log | grep "planmarshall" | grep -v "from plan-marshall" | sed -E 's#/de/planmarshall/.*##' | sort | uniq -c
          grep -E "BUILD|Reactor Summary" build.log
