# TEMPORARY, for one run: a build with Maven transfer output, to show that the parent POM and the SNAPSHOT
# modules are downloaded from the organisation registry with the workflow token. Removed again in this pull
# request; the regular workflows run Maven with --no-transfer-progress.
name: Transfer output (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transfer-output:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with transfer output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw -B verify -DskipTests > build.log 2>&1 || { tail -50 build.log; exit 1; }
      - name: Downloads from the organisation registry
        run: |
          grep -E "Download(ing|ed) from plan-marshall" build.log | grep -E "pm-mcp-parent|pm-api|pm-core|pm-runtime|pm-provider|pm-relay|pm-operator|pm-exec" || { echo "no download from the registry found"; exit 1; }
          echo "---"
          grep -E "BUILD|Reactor Summary" build.log
