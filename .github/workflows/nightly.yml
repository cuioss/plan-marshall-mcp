# Nightly build against the newest SNAPSHOT of the upstream repositories (pm-mcp-clients and pm-mcp-core).
#
# Every build resolves the newest SNAPSHOT from the organisation registry, so a change merged upstream reaches
# this repository with its next build. This run makes that next build happen by the next morning without a pull
# request here: a break caused upstream shows as a failed run of this workflow. It is a plain workflow, because a
# scheduled run of the reusable build is subject to its changed-paths filter, which has nothing to compare at
# night. It deploys nothing and receives no credential but the GITHUB_TOKEN of the run.
name: Nightly

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw -B --no-transfer-progress verify
      # pm-conformance is a module of the build with the profile conformance only, so no other step and no
      # required check builds it. This step compiles its main and test sources and runs nothing, so that the
      # module cannot stop compiling unnoticed. It stays out of every required check.
      - name: Conformance harness compiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw -B --no-transfer-progress test-compile -Pconformance -pl pm-conformance
      - name: Integration tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw -B --no-transfer-progress verify -Pintegration-tests
      - name: Upstream SNAPSHOT versions of this run
        if: always()
        run: find ~/.m2/repository/de/planmarshall -path "*-SNAPSHOT/*" -name "*.pom" ! -name "*-SNAPSHOT.pom" 2>/dev/null | sed 's#.*/##' | sort
