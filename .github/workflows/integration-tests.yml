# Runs the integration tests (@QuarkusIntegrationTest against the packaged application) via Maven
# (reusable workflow from cuioss-organization).
name: Integration Tests

# Integration tests are the long-running suite: they build only on the default
# branch (post-merge) and on pull requests, never on every feature-branch push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Required when the repo uses a GitHub merge queue: without it the queued
  # checks never report and the queue times out.
  merge_group:

permissions:
  contents: read

jobs:
  integration-tests:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-integration-tests.yml@5fb6e07834411caa78a0eefe6e6a0554c9a957e6 # v0.32.0
    with:
      report-name: integration-tests
      maven-args-input: |
        verify -Pintegration-tests -pl plan-marshall-mcp -am
      reports-folder: |
        plan-marshall-mcp/target/failsafe-reports
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
