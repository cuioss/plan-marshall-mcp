# Runs the integration tests (@QuarkusIntegrationTest against the packaged application) via Maven
# (reusable workflow from cuioss-organization).
name: Integration Tests

# Integration tests are the long-running suite: they build only on the default
# branch (post-merge) and on pull requests, never on every feature-branch push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Required when the repo uses a GitHub merge queue: without it the queued
  # checks never report and the queue times out.
  merge_group:

permissions:
  contents: read

jobs:
  integration-tests:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-integration-tests.yml@b2de4107d3d53a41a7edab7e2513887c309b8237 # v0.36.0
    with:
      report-name: integration-tests
      maven-args-input: |
        verify -Pintegration-tests -pl pm-mcp-server -am
      reports-folder: |
        pm-mcp-server/target/failsafe-reports
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
