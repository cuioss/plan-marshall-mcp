quarkus.application.name=pm-mcpd

# Application traffic (MCP Streamable HTTP endpoint at /mcp)
quarkus.http.port=8080
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.server-info.name=plan-marshall-mcp

# Logging
quarkus.log.level=INFO
quarkus.log.category."de.cuioss.pm".level=INFO

# Test coverage: quarkus-jacoco writes into the Maven JaCoCo data file, so the Sonar report
# (-Pcoverage) contains both @QuarkusTest and plain unit-test coverage
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
