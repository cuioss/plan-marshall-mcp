<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: flow; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Evaluation of the open issues in three stages</title>
  <desc id="desc">Stage 1 verifies the supervision protocol (E1 to E6) on the existing stub before the decision gate. After the operator decides, a follow-up plan applies the decisions and Stage 2 verifies the target picture on real cases (E7 to E9). Stage 3 (E10 to E12) runs only if Stage 1 leaves its question open.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <line class="arrow" x1="40" y1="150" x2="1060" y2="150" marker-end="url(#arrow)"/>
  <rect class="stroke" x="100" y="115" width="140" height="70" rx="6" ry="6"/>
  <text x="170" y="105" class="hdr">Stage 1</text>
  <text x="170" y="203" class="col-sub">E1 to E6: supervision</text>
  <text x="170" y="217" class="col-sub">before the gate</text>
  <path class="stroke" d="M 400 116 L 434 150 L 400 184 L 366 150 Z"/>
  <text x="400" y="104" class="hdr">decision gate</text>
  <text x="400" y="202" class="col-sub">the operator decides</text>
  <rect class="stroke" x="560" y="115" width="140" height="70" rx="6" ry="6"/>
  <text x="630" y="105" class="hdr">follow-up plan</text>
  <text x="630" y="203" class="col-sub">decisions applied to</text>
  <text x="630" y="217" class="col-sub">requirements, specs, M2 to M14</text>
  <rect class="stroke" x="810" y="115" width="140" height="70" rx="6" ry="6"/>
  <text x="880" y="105" class="hdr">Stage 2</text>
  <text x="880" y="203" class="col-sub">E7 to E9: real cases,</text>
  <text x="880" y="217" class="col-sub">roles, screener</text>
  <circle class="stroke" cx="280" cy="150" r="4"/>
  <line class="arrow" x1="280" y1="154" x2="280" y2="248" marker-end="url(#arrow)"/>
  <rect class="stroke" x="205" y="250" width="150" height="40" rx="6" ry="6"/>
  <text x="280" y="275" class="txt-c">Stage 3: E10 to E12</text>
  <text x="370" y="274" class="note">only if Stage 1 leaves its question open</text>
</svg>
