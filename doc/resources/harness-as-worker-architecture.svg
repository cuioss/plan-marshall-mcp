<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: deployment; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Harness as worker on a developer machine: parts and connections (proposal)</title>
  <desc id="desc">Proposed topology of the harness-as-worker architecture on one developer machine. The always-on daemon pm-mcpd holds the workflow engine, the task queue, the supervisor, and the stores. The supervisor spawns headless worker processes through pm-exec inside a confinement; each worker is a harness with its relay pm-mcp serve --job, which connects to the task queue over HTTP on the Unix socket. The interactive session reaches the daemon through its own relay. Harnesses reach their model providers over HTTPS with their own login. The trust boundary is the local user: everything inside runs as that user and authenticates to the daemon with the runtime token or a job token. The collapsed group of headless workers stands for one worker per active role, each with its own harness, model, and tool set. The relays connect to the socket of the daemon, through which the task queue is reached.</desc>
