<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: sequence; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Consultation: a worker asks another role through the server</title>
  <desc id="desc">A worker that needs another model judgment follows a consultation link instead of submitting a result. The server offers the question as a task to a worker of the consulted role, which answers through its submit link. The asking worker waits meanwhile and receives the answer as the answer to its pending wait, then submits its own result referring to the consultation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="150" y="30" class="col-header">asking worker</text>
  <rect class="stroke" x="65" y="42" width="170" height="34" rx="6" ry="6"/>
  <text x="150" y="64" class="item-c">e.g. project triage</text>
  <text x="450" y="30" class="col-header">server</text>
  <rect class="stroke" x="365" y="42" width="170" height="34" rx="6" ry="6"/>
  <text x="450" y="64" class="item-c">pm-mcpd</text>
  <text x="750" y="30" class="col-header">consulted worker</text>
  <rect class="stroke" x="665" y="42" width="170" height="34" rx="6" ry="6"/>
  <text x="750" y="64" class="item-c">e.g. review role</text>
  <line class="arrow" x1="156" y1="112" x2="444" y2="112" marker-end="url(#arrow)"/>
  <text x="300" y="104" class="arrow-lbl">follow consultation link: question</text>
  <line class="arrow" x1="156" y1="148" x2="444" y2="148" marker-end="url(#arrow)"/>
  <text x="300" y="140" class="arrow-lbl">wait (state: consulting)</text>
  <line class="arrow-return" x1="456" y1="184" x2="744" y2="184" marker-end="url(#arrow)"/>
  <text x="600" y="176" class="arrow-lbl">offer the question as a task</text>
  <line class="arrow" x1="744" y1="220" x2="456" y2="220" marker-end="url(#arrow)"/>
  <text x="600" y="212" class="arrow-lbl">submit: answer</text>
  <rect class="activation" x="745" y="184" width="10" height="36" rx="0" ry="0"/>
  <line class="arrow-return" x1="444" y1="256" x2="156" y2="256" marker-end="url(#arrow)"/>
  <text x="300" y="248" class="arrow-lbl">answer, as the answer to the pending wait</text>
  <rect class="activation" x="145" y="148" width="10" height="108" rx="0" ry="0"/>
  <text x="162" y="206" class="note">held, with progress</text>
  <line class="arrow" x1="156" y1="292" x2="444" y2="292" marker-end="url(#arrow)"/>
  <text x="300" y="284" class="arrow-lbl">submit own result (refers to the consultation)</text>
  <line class="lifeline" x1="150" y1="76" x2="150" y2="332"/>
  <line class="lifeline" x1="450" y1="76" x2="450" y2="332"/>
  <line class="lifeline" x1="750" y1="76" x2="750" y2="332"/>
  <text x="450" y="356" class="col-sub">deterministic, and within the single-level leaf constraint</text>
</svg>
