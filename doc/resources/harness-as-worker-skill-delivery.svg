<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: block; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Skill delivery: one catalogue, delivered today with a shim and later by the host</title>
  <desc id="desc">The left column lists the skill catalogue that pm-mcpd generates per project in the structures of the MCP Skills Extension: core conduct, task protocol, role skills, state and domain skills, each file with a SHA-256 digest. The middle column shows delivery today: in the prompt file of a fresh job, in the offers of a warm worker once per generation, and through pm_skill and the shim skill for the interactive session, with a delivery record per worker generation. The right column shows delivery once a host supports the extension: the host lists and activates the skills itself, offers name skills by URI only, and the shim is removed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="36" y="98" class="txt-b">core conduct</text>
  <text x="36" y="118" class="txt">rules for every model</text>
  <text x="356" y="98" class="txt-b">fresh job</text>
  <text x="356" y="118" class="txt">in its prompt file</text>
  <text x="676" y="98" class="txt-b">skills/list, resources/read</text>
  <text x="676" y="118" class="txt">the host builds its registry</text>
  <text x="36" y="148" class="txt-b">task protocol</text>
  <text x="36" y="168" class="txt">client logic of the protocol</text>
  <text x="356" y="148" class="txt-b">warm worker</text>
  <text x="356" y="168" class="txt">in the offer, once per</text>
  <text x="356" y="188" class="txt">generation</text>
  <text x="676" y="148" class="txt-b">host activation</text>
  <text x="676" y="168" class="txt">approval and digest check</text>
  <text x="36" y="218" class="txt-b">role skills</text>
  <text x="36" y="238" class="txt">contract of each role</text>
  <text x="356" y="218" class="txt-b">interactive session</text>
  <text x="356" y="238" class="txt">pm_skill and the shim skill</text>
  <text x="676" y="218" class="txt-b">offers</text>
  <text x="676" y="238" class="txt">name skills by URI only</text>
  <text x="36" y="268" class="txt-b">state and domain skills</text>
  <text x="36" y="288" class="txt">manifests: SHA-256 per file</text>
  <text x="356" y="268" class="txt-b">delivery record</text>
  <text x="356" y="288" class="txt">per worker generation</text>
  <text x="676" y="268" class="txt-b">shim</text>
  <text x="676" y="288" class="txt">removed from the bundle</text>
  <text x="140" y="28" class="col-header">skill catalogue</text>
  <rect class="stroke" x="20" y="44" width="240" height="308" rx="6" ry="6"/>
  <text x="140" y="70" class="col-sub">pm-mcpd, per project</text>
  <text x="140" y="336" class="col-sub">static vocabulary, digests</text>
  <text x="460" y="28" class="col-header">delivery today</text>
  <rect class="stroke" x="340" y="44" width="240" height="308" rx="6" ry="6"/>
  <text x="460" y="70" class="col-sub">with the shim</text>
  <text x="460" y="336" class="col-sub">pushed, never awaited</text>
  <text x="780" y="28" class="col-header">delivery later</text>
  <rect class="stroke" x="660" y="44" width="240" height="308" rx="6" ry="6"/>
  <text x="780" y="70" class="col-sub">host supports the extension</text>
  <text x="780" y="336" class="col-sub">per host and connection</text>
  <line class="arrow" x1="264" y1="152" x2="336" y2="152" marker-end="url(#arrow)"/>
  <text x="300" y="144" class="arrow-lbl">serves</text>
  <line class="arrow" x1="584" y1="152" x2="656" y2="152" marker-end="url(#arrow)"/>
  <text x="620" y="132" class="arrow-lbl">same</text>
  <text x="620" y="144" class="arrow-lbl">manifests</text>
</svg>
