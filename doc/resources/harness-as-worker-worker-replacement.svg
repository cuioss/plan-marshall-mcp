<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: sequence; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Supervision: a lost worker is replaced and fenced off</title>
  <desc id="desc">The task queue offers a task to worker generation 1, which stalls and does not acknowledge. When the acknowledgement deadline passes, the supervisor ends generation 1, releases the lease at once, and starts generation 2, which receives the same task, acknowledges, and submits. A late submit of generation 1 is refused because the task is no longer leased to it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="100" y="30" class="col-header">worker</text>
  <rect class="stroke" x="30" y="42" width="140" height="34" rx="6" ry="6"/>
  <text x="100" y="64" class="item-c">generation 1</text>
  <text x="340" y="30" class="col-header">task queue</text>
  <rect class="stroke" x="270" y="42" width="140" height="34" rx="6" ry="6"/>
  <text x="340" y="64" class="item-c">pm-mcpd</text>
  <text x="570" y="30" class="col-header">supervisor</text>
  <rect class="stroke" x="500" y="42" width="140" height="34" rx="6" ry="6"/>
  <text x="570" y="64" class="item-c">pm-mcpd</text>
  <text x="790" y="30" class="col-header">worker</text>
  <rect class="stroke" x="720" y="42" width="140" height="34" rx="6" ry="6"/>
  <text x="790" y="64" class="item-c">generation 2</text>
  <line class="arrow-return" x1="334" y1="112" x2="106" y2="112" marker-end="url(#arrow)"/>
  <text x="220" y="104" class="arrow-lbl">offer task T (lease: gen 1)</text>
  <text x="112" y="148" class="note">stalls, no acknowledgement</text>
  <line class="arrow" x1="346" y1="182" x2="564" y2="182" marker-end="url(#arrow)"/>
  <text x="455" y="174" class="arrow-lbl">acknowledgement deadline passed</text>
  <line class="arrow" x1="564" y1="218" x2="106" y2="218" marker-end="url(#arrow)"/>
  <text x="335" y="210" class="arrow-lbl">SIGTERM, then SIGKILL</text>
  <line class="arrow" x1="564" y1="254" x2="346" y2="254" marker-end="url(#arrow)"/>
  <text x="455" y="246" class="arrow-lbl">release lease of T at once</text>
  <line class="arrow" x1="576" y1="290" x2="784" y2="290" marker-end="url(#arrow)"/>
  <text x="680" y="282" class="arrow-lbl">start (job token, generation 2)</text>
  <line class="arrow" x1="784" y1="326" x2="346" y2="326" marker-end="url(#arrow)"/>
  <text x="565" y="318" class="arrow-lbl">wait</text>
  <line class="arrow-return" x1="346" y1="362" x2="784" y2="362" marker-end="url(#arrow)"/>
  <text x="565" y="354" class="arrow-lbl">offer task T (lease: gen 2)</text>
  <line class="arrow" x1="784" y1="398" x2="346" y2="398" marker-end="url(#arrow)"/>
  <text x="565" y="390" class="arrow-lbl">acknowledge, work, submit</text>
  <rect class="activation" x="785" y="326" width="10" height="72" rx="0" ry="0"/>
  <line class="arrow" x1="106" y1="434" x2="334" y2="434" marker-end="url(#arrow)"/>
  <text x="220" y="426" class="arrow-lbl">late submit of T (gen 1)</text>
  <line class="arrow-return" x1="334" y1="470" x2="106" y2="470" marker-end="url(#arrow)"/>
  <text x="220" y="462" class="arrow-lbl">refused: not bound to gen 1</text>
  <rect class="activation" x="565" y="182" width="10" height="108" rx="0" ry="0"/>
  <line class="lifeline" x1="100" y1="76" x2="100" y2="510"/>
  <line class="lifeline" x1="340" y1="76" x2="340" y2="510"/>
  <line class="lifeline" x1="570" y1="76" x2="570" y2="510"/>
  <line class="lifeline" x1="790" y1="76" x2="790" y2="510"/>
  <text x="450" y="534" class="col-sub">the task is done exactly once; nothing depends on the transport</text>
</svg>
