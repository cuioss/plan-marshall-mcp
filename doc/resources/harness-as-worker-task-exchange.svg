<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: sequence; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Task protocol: one task from offer to submit</title>
  <desc id="desc">A worker holds a wait call open on the task queue; when the bounded wait expires it is told to wait again. When the workflow engine puts a task for the worker role into the queue, the queue answers the pending wait with an offer. The worker acknowledges, works along the task links (its calls are heartbeats), and submits a structured result; the queue validates it, releases the lease, and the engine continues while the worker waits again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="150" y="30" class="col-header">workflow engine</text>
  <rect class="stroke" x="75" y="42" width="150" height="34" rx="6" ry="6"/>
  <text x="150" y="64" class="item-c">pm-mcpd</text>
  <text x="450" y="30" class="col-header">task queue</text>
  <rect class="stroke" x="375" y="42" width="150" height="34" rx="6" ry="6"/>
  <text x="450" y="64" class="item-c">pm-mcpd</text>
  <text x="750" y="30" class="col-header">worker</text>
  <rect class="stroke" x="675" y="42" width="150" height="34" rx="6" ry="6"/>
  <text x="750" y="64" class="item-c">harness + relay</text>
  <line class="arrow" x1="744" y1="112" x2="456" y2="112" marker-end="url(#arrow)"/>
  <text x="600" y="104" class="arrow-lbl">wait</text>
  <line class="arrow-return" x1="456" y1="148" x2="744" y2="148" marker-end="url(#arrow)"/>
  <text x="600" y="140" class="arrow-lbl">wait again (bounded wait expired)</text>
  <line class="arrow" x1="744" y1="184" x2="456" y2="184" marker-end="url(#arrow)"/>
  <text x="600" y="176" class="arrow-lbl">wait</text>
  <line class="arrow" x1="156" y1="220" x2="444" y2="220" marker-end="url(#arrow)"/>
  <text x="300" y="212" class="arrow-lbl">task for the role</text>
  <line class="arrow-return" x1="456" y1="256" x2="744" y2="256" marker-end="url(#arrow)"/>
  <text x="600" y="248" class="arrow-lbl">offer: task and its links, leased to this generation</text>
  <rect class="activation" x="745" y="112" width="10" height="36" rx="0" ry="0"/>
  <rect class="activation" x="745" y="184" width="10" height="72" rx="0" ry="0"/>
  <text x="600" y="212" class="col-sub">held up to the bounded wait, with progress</text>
  <line class="arrow" x1="744" y1="292" x2="456" y2="292" marker-end="url(#arrow)"/>
  <text x="600" y="284" class="arrow-lbl">acknowledge</text>
  <line class="arrow" x1="744" y1="328" x2="456" y2="328" marker-end="url(#arrow)"/>
  <text x="600" y="320" class="arrow-lbl">calls along the links (heartbeats)</text>
  <line class="arrow" x1="744" y1="364" x2="456" y2="364" marker-end="url(#arrow)"/>
  <text x="600" y="356" class="arrow-lbl">submit: structured result</text>
  <rect class="activation" x="745" y="292" width="10" height="72" rx="0" ry="0"/>
  <line class="arrow-return" x1="444" y1="400" x2="156" y2="400" marker-end="url(#arrow)"/>
  <text x="300" y="392" class="arrow-lbl">result validated, lease released</text>
  <rect class="activation" x="445" y="364" width="10" height="36" rx="0" ry="0"/>
  <line class="arrow" x1="744" y1="436" x2="456" y2="436" marker-end="url(#arrow)"/>
  <text x="600" y="428" class="arrow-lbl">wait (next task, wait again, or end)</text>
  <line class="lifeline" x1="150" y1="76" x2="150" y2="476"/>
  <line class="lifeline" x1="450" y1="76" x2="450" y2="476"/>
  <line class="lifeline" x1="750" y1="76" x2="750" y2="476"/>
  <text x="450" y="500" class="col-sub">every transition is server logic; the model only follows links</text>
</svg>
