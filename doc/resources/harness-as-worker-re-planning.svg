<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: flow; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Dynamic re-planning of a running plan</title>
  <desc id="desc">A running plan meets a changed premise: the base branch moved, a trial merge conflicts, a downstream limit will be exceeded, a ceiling or budget is reached, or a deliverable is infeasible. The server detects the trigger and offers a re-planning task to the planning agent, which chooses one of the actions the server offers. The revised outline and tasks pass the same guards as a first plan, and the plan re-enters execute; hand back ends the plan by its defined fallback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <line class="arrow" x1="40" y1="180" x2="1060" y2="180" marker-end="url(#arrow)"/>
  <rect class="stroke" x="90" y="145" width="120" height="70" rx="6" ry="6"/>
  <text x="150" y="135" class="hdr">plan running</text>
  <text x="150" y="233" class="col-sub">execute or finalize</text>
  <rect class="stroke" x="290" y="150" width="120" height="60" rx="6" ry="6"/>
  <text x="350" y="140" class="hdr">trigger</text>
  <text x="350" y="228" class="col-sub">base moved, conflicts,</text>
  <text x="350" y="242" class="col-sub">limit, ceiling, budget</text>
  <path class="stroke" d="M 560 146 L 594 180 L 560 214 L 526 180 Z"/>
  <text x="560" y="134" class="hdr">planning agent</text>
  <text x="560" y="90" class="col-sub">re-integrate, split, defer,</text>
  <text x="560" y="104" class="col-sub">wait, rebase and re-verify</text>
  <rect class="stroke" x="710" y="145" width="120" height="70" rx="6" ry="6"/>
  <text x="770" y="135" class="hdr">server guards</text>
  <text x="770" y="233" class="col-sub">revised outline and tasks</text>
  <rect class="stroke" x="900" y="150" width="120" height="60" rx="6" ry="6"/>
  <text x="960" y="140" class="hdr">plan continues</text>
  <text x="960" y="228" class="col-sub">with its revised tasks</text>
  <circle class="stroke" cx="865" cy="180" r="4"/>
  <path class="arrow" d="M 865 176 V 72 H 60 V 174" marker-end="url(#arrow)"/>
  <text x="462" y="64" class="arrow-lbl">revised plan re-enters execute</text>
  <line class="arrow" x1="560" y1="214" x2="560" y2="292" marker-end="url(#arrow)"/>
  <rect class="stroke" x="500" y="294" width="120" height="40" rx="6" ry="6"/>
  <text x="560" y="319" class="hdr">hand back</text>
  <text x="640" y="318" class="note">defined fallback, no question</text>
</svg>
