<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: block; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Session-driven and server-driven control of a plan</title>
  <desc id="desc">Three columns show the interactive session, PM-MCP, and a headless harness, each in both directions. Session-driven: the session calls pm_state and pm_do, and nothing advances unless it does. Server-driven: PM-MCP launches headless harness processes, offers them tasks, and evaluates what they submit; the session enters, answers, and watches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="36" y="98" class="note">session-driven</text>
  <text x="36" y="118" class="txt">drives every link state</text>
  <text x="36" y="138" class="txt">with pm_state and pm_do</text>
  <text x="356" y="98" class="note">session-driven</text>
  <text x="356" y="118" class="txt">waits until a session calls;</text>
  <text x="356" y="138" class="txt">launches jobs for delegated work</text>
  <text x="676" y="98" class="note">session-driven</text>
  <text x="676" y="118" class="txt">a job for one piece of</text>
  <text x="676" y="138" class="txt">delegated work</text>
  <line class="sep" x1="52" y1="162" x2="228" y2="162"/>
  <line class="sep" x1="372" y1="162" x2="548" y2="162"/>
  <line class="sep" x1="692" y1="162" x2="868" y2="162"/>
  <text x="36" y="186" class="note">server-driven</text>
  <text x="36" y="206" class="txt">enters a plan, answers</text>
  <text x="36" y="226" class="txt">questions, watches</text>
  <text x="356" y="186" class="note">server-driven</text>
  <text x="356" y="206" class="txt">drives plans and epics,</text>
  <text x="356" y="226" class="txt">offers tasks, supervises</text>
  <text x="676" y="186" class="note">server-driven</text>
  <text x="676" y="206" class="txt">a worker for every piece</text>
  <text x="676" y="226" class="txt">of model work</text>
  <text x="140" y="28" class="col-header">interactive session</text>
  <rect class="stroke" x="20" y="44" width="240" height="246" rx="6" ry="6"/>
  <text x="140" y="70" class="col-sub">the harness with the user</text>
  <text x="140" y="274" class="col-sub">a plan stops when it stops</text>
  <text x="460" y="28" class="col-header">PM-MCP</text>
  <rect class="stroke" x="340" y="44" width="240" height="246" rx="6" ry="6"/>
  <text x="460" y="70" class="col-sub">pm-mcpd</text>
  <text x="460" y="274" class="col-sub">nothing depends on a session</text>
  <text x="780" y="28" class="col-header">headless harness</text>
  <rect class="stroke" x="660" y="44" width="240" height="246" rx="6" ry="6"/>
  <text x="780" y="70" class="col-sub">started by the server</text>
  <text x="780" y="274" class="col-sub">judgment and work only</text>
  <line class="arrow" x1="264" y1="122" x2="336" y2="122" marker-end="url(#arrow)"/>
  <text x="300" y="102" class="arrow-lbl">pm_state,</text>
  <text x="300" y="114" class="arrow-lbl">pm_do</text>
  <line class="arrow" x1="584" y1="200" x2="656" y2="200" marker-end="url(#arrow)"/>
  <text x="620" y="180" class="arrow-lbl">launch,</text>
  <text x="620" y="192" class="arrow-lbl">offer task</text>
  <line class="arrow" x1="656" y1="226" x2="584" y2="226" marker-end="url(#arrow)"/>
  <text x="620" y="244" class="arrow-lbl">submit</text>
</svg>
