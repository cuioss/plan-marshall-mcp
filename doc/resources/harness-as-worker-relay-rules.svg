<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: sequence; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Relay rules between a sessionless host and the server</title>
  <desc id="desc">Three rules for the relay pm-mcp serve, found while connecting hosts. A sessionless host carries its protocol data in params._meta; the relay adds the Mcp-Method and Mcp-Name headers the HTTP transport demands. A body the server returns for a notification is discarded, never written to the host. When the server stream is lost during a held call, the relay answers the pending request with an error at once.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="150" y="30" class="col-header">host</text>
  <rect class="stroke" x="65" y="42" width="170" height="34" rx="6" ry="6"/>
  <text x="150" y="64" class="item-c">sessionless, stdio</text>
  <text x="450" y="30" class="col-header">relay</text>
  <rect class="stroke" x="365" y="42" width="170" height="34" rx="6" ry="6"/>
  <text x="450" y="64" class="item-c">pm-mcp serve</text>
  <text x="750" y="30" class="col-header">server</text>
  <rect class="stroke" x="665" y="42" width="170" height="34" rx="6" ry="6"/>
  <text x="750" y="64" class="item-c">pm-mcpd</text>
  <text x="20" y="102" class="txt-b">1  requests</text>
  <line class="arrow" x1="156" y1="122" x2="444" y2="122" marker-end="url(#arrow)"/>
  <text x="300" y="114" class="arrow-lbl">tools/call, protocol data in params._meta</text>
  <line class="arrow" x1="456" y1="158" x2="744" y2="158" marker-end="url(#arrow)"/>
  <text x="600" y="150" class="arrow-lbl">POST + Mcp-Method, Mcp-Name, identity</text>
  <line class="arrow-return" x1="744" y1="194" x2="456" y2="194" marker-end="url(#arrow)"/>
  <text x="600" y="186" class="arrow-lbl">answer</text>
  <line class="arrow-return" x1="444" y1="230" x2="156" y2="230" marker-end="url(#arrow)"/>
  <text x="300" y="222" class="arrow-lbl">answer</text>
  <text x="20" y="260" class="txt-b">2  notifications</text>
  <line class="arrow" x1="156" y1="280" x2="444" y2="280" marker-end="url(#arrow)"/>
  <text x="300" y="272" class="arrow-lbl">notifications/roots/list_changed</text>
  <line class="arrow" x1="456" y1="316" x2="744" y2="316" marker-end="url(#arrow)"/>
  <text x="600" y="308" class="arrow-lbl">POST</text>
  <line class="arrow-return" x1="744" y1="352" x2="456" y2="352" marker-end="url(#arrow)"/>
  <text x="600" y="344" class="arrow-lbl">body (for some notifications)</text>
  <text x="462" y="378" class="note">discarded: a notification is never answered</text>
  <text x="20" y="408" class="txt-b">3  lost server</text>
  <line class="arrow" x1="156" y1="428" x2="444" y2="428" marker-end="url(#arrow)"/>
  <text x="300" y="420" class="arrow-lbl">tools/call (held)</text>
  <line class="arrow" x1="456" y1="464" x2="744" y2="464" marker-end="url(#arrow)"/>
  <text x="600" y="456" class="arrow-lbl">POST (held)</text>
  <line class="stroke" x1="743" y1="483" x2="757" y2="497"/>
  <line class="stroke" x1="743" y1="497" x2="757" y2="483"/>
  <text x="762" y="494" class="note">stream lost</text>
  <line class="arrow-return" x1="444" y1="524" x2="156" y2="524" marker-end="url(#arrow)"/>
  <text x="300" y="516" class="arrow-lbl">error at once</text>
  <rect class="activation" x="445" y="428" width="10" height="96" rx="0" ry="0"/>
  <line class="lifeline" x1="150" y1="76" x2="150" y2="564"/>
  <line class="lifeline" x1="450" y1="76" x2="450" y2="564"/>
  <line class="lifeline" x1="750" y1="76" x2="750" y2="564"/>
  <text x="450" y="588" class="col-sub">the host never waits out its own limit on a dead server</text>
</svg>
