<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: deployment; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Verification setup of Milestone 0, Part A on the developer machine</title>
  <desc id="desc">Topology of the verification runs of Milestone 0, Part A. The driver pull.py starts one stub process and one harness process per run and reads every log. The stub is the Quarkus application plan-marshall-mcp with the spike tools, configured by scenario.json and writing events.jsonl. The harness runs in a working directory outside the repository and starts relay.py over stdio, the stand-in for pm-mcp serve, which forwards to the stub over HTTP and writes its own log. The harness reaches its model provider over HTTPS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }

      .edge-lbl   { font-size: 11px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .edge-lbl-c { font-size: 11px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .trust      { stroke: #6e7681; stroke-width: 2.0; stroke-dasharray: 8 4; fill: none; }
      .trust-lbl  { font-size: 11px; fill: #6e7681; font-weight: 600; }
      .trust-cross { stroke: #6e7681; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect class="stroke" x="24" y="24" width="952" height="440" rx="8" ry="8"/>
  <text x="36" y="48" class="encl">developer machine</text>
  <text x="36" y="64" class="encl-sub">one run: one stub, one harness (or two workers in V9)</text>
  <rect class="stroke" x="56" y="84" width="240" height="88" rx="4" ry="4"/>
  <line class="own-bar" x1="56" y1="92" x2="56" y2="164"/>
  <text x="68" y="108" class="encl">driver</text>
  <text x="68" y="124" class="encl-sub">pull.py: start, kill, read logs</text>
  <rect class="stroke" x="56" y="236" width="400" height="204" rx="6" ry="6"/>
  <text x="68" y="260" class="encl">stub process</text>
  <text x="68" y="276" class="encl-sub">plan-marshall-mcp, pm.spike.scenario set</text>
  <rect class="stroke" x="80" y="296" width="352" height="92" rx="4" ry="4"/>
  <line class="own-bar" x1="80" y1="304" x2="80" y2="380"/>
  <text x="92" y="320" class="encl">spike tools</text>
  <text x="92" y="336" class="encl-sub">pull_wait, pull_submit, pull_info; leases, slots</text>
  <line class="mount-stem" x1="104" y1="388" x2="104" y2="400"/>
  <rect class="stroke" x="80" y="400" width="96" height="18" rx="4" ry="4"/>
  <text x="88" y="413" class="mount">scenario.json</text>
  <line class="mount-stem" x1="208" y1="388" x2="208" y2="400"/>
  <rect class="stroke" x="184" y="400" width="88" height="18" rx="4" ry="4"/>
  <text x="192" y="413" class="mount">events.jsonl</text>
  <rect class="stroke" x="536" y="84" width="408" height="356" rx="6" ry="6"/>
  <text x="548" y="108" class="encl">worker directory</text>
  <text x="548" y="124" class="encl-sub">outside the repository: $TMPDIR/pull-spike-ws/&lt;run&gt;</text>
  <rect class="stroke" x="560" y="144" width="360" height="88" rx="4" ry="4"/>
  <text x="572" y="168" class="encl">harness</text>
  <text x="572" y="184" class="encl-sub">Claude Code, OpenCode, Antigravity</text>
  <text x="572" y="216" class="encl-sub">output stamped into harness-&lt;worker&gt;.jsonl</text>
  <rect class="stroke" x="560" y="296" width="360" height="92" rx="4" ry="4"/>
  <line class="own-bar" x1="560" y1="304" x2="560" y2="380"/>
  <text x="572" y="320" class="encl">relay.py</text>
  <text x="572" y="336" class="encl-sub">stand-in for pm-mcp serve; carries the worker id</text>
  <line class="mount-stem" x1="584" y1="388" x2="584" y2="400"/>
  <rect class="stroke" x="560" y="400" width="136" height="18" rx="4" ry="4"/>
  <text x="568" y="413" class="mount">relay-&lt;worker&gt;.jsonl</text>
  <line class="arrow" x1="740" y1="234" x2="740" y2="294" marker-end="url(#arrow)"/>
  <text x="748" y="268" class="edge-lbl">MCP stdio</text>
  <line class="arrow" x1="558" y1="342" x2="434" y2="342" marker-end="url(#arrow)"/>
  <text x="496" y="334" class="edge-lbl-c">HTTP :port</text>
  <path class="arrow" d="M 296 150 H 516 V 188 H 558" marker-end="url(#arrow)"/>
  <text x="406" y="142" class="edge-lbl-c">spawn</text>
  <line class="arrow" x1="176" y1="174" x2="176" y2="234" marker-end="url(#arrow)"/>
  <text x="184" y="208" class="edge-lbl">spawn</text>
  <rect class="stroke" x="560" y="512" width="240" height="48" rx="4" ry="4"/>
  <text x="572" y="536" class="encl">model provider</text>
  <path class="arrow" d="M 920 188 H 960 V 536 H 802" marker-end="url(#arrow)"/>
  <text x="881" y="528" class="edge-lbl-c">HTTPS :443</text>
</svg>
