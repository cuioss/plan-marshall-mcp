<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: state; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Worker lifecycle in the task protocol: states and transitions</title>
  <desc id="desc">A worker waits, is offered a task, acknowledges it, executes along its links, possibly consults another role, and submits; after a submit it waits again. A missing acknowledgement, silence, or an exited process makes the server end it as lost and release its lease. On the server instruction (idle timeout, token budget, shutdown) it ends.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <rect class="stroke" x="60" y="220" width="120" height="60" rx="8" ry="8"/>
  <text x="120" y="248" class="hdr">waiting</text>
  <text x="120" y="266" class="col-sub">holds a wait call</text>
  <rect class="stroke" x="270" y="220" width="120" height="60" rx="8" ry="8"/>
  <text x="330" y="248" class="hdr">offered</text>
  <text x="330" y="266" class="col-sub">task leased</text>
  <rect class="stroke" x="480" y="220" width="120" height="60" rx="8" ry="8"/>
  <text x="540" y="248" class="hdr">acknowledged</text>
  <text x="540" y="266" class="col-sub">task confirmed</text>
  <rect class="stroke" x="690" y="220" width="120" height="60" rx="8" ry="8"/>
  <text x="750" y="248" class="hdr">executing</text>
  <text x="750" y="266" class="col-sub">calls = heartbeats</text>
  <rect class="stroke" x="900" y="220" width="120" height="60" rx="8" ry="8"/>
  <text x="960" y="248" class="hdr">submitted</text>
  <text x="960" y="266" class="col-sub">lease released</text>
  <circle class="dot" cx="30" cy="250" r="6"/>
  <line class="arrow" x1="36" y1="250" x2="58" y2="250" marker-end="url(#arrow)"/>
  <line class="arrow" x1="180" y1="250" x2="268" y2="250" marker-end="url(#arrow)"/>
  <text x="225" y="242" class="arrow-lbl">offer</text>
  <line class="arrow" x1="390" y1="250" x2="478" y2="250" marker-end="url(#arrow)"/>
  <text x="435" y="242" class="arrow-lbl">acknowledge</text>
  <line class="arrow" x1="600" y1="250" x2="688" y2="250" marker-end="url(#arrow)"/>
  <text x="645" y="242" class="arrow-lbl">first call</text>
  <line class="arrow" x1="810" y1="250" x2="898" y2="250" marker-end="url(#arrow)"/>
  <text x="855" y="242" class="arrow-lbl">submit</text>
  <rect class="stroke" x="690" y="80" width="120" height="60" rx="8" ry="8"/>
  <text x="750" y="108" class="hdr">consulting</text>
  <text x="750" y="126" class="col-sub">waits for an answer</text>
  <line class="arrow" x1="732" y1="220" x2="732" y2="142" marker-end="url(#arrow)"/>
  <text x="724" y="186" class="arrow-lbl">consult</text>
  <line class="arrow" x1="768" y1="140" x2="768" y2="218" marker-end="url(#arrow)"/>
  <text x="814" y="186" class="arrow-lbl">answer</text>
  <rect class="stroke" x="60" y="80" width="120" height="60" rx="8" ry="8"/>
  <text x="120" y="108" class="hdr">ended</text>
  <text x="120" y="126" class="col-sub">on instruction</text>
  <line class="arrow" x1="120" y1="220" x2="120" y2="142" marker-end="url(#arrow)"/>
  <text x="70" y="186" class="arrow-lbl">idle, budget,</text>
  <text x="70" y="198" class="arrow-lbl">shutdown</text>
  <path class="arrow" d="M 960 220 V 48 H 150 V 78" marker-end="url(#arrow)"/>
  <text x="560" y="40" class="arrow-lbl">end</text>
  <rect class="stroke" x="455" y="380" width="170" height="60" rx="8" ry="8"/>
  <text x="540" y="408" class="hdr">lost</text>
  <text x="540" y="426" class="col-sub">lease released at once</text>
  <line class="arrow" x1="350" y1="280" x2="474" y2="380" marker-end="url(#arrow)"/>
  <text x="392" y="346" class="arrow-lbl">deadline, exit</text>
  <line class="arrow" x1="540" y1="280" x2="540" y2="378" marker-end="url(#arrow)"/>
  <text x="588" y="332" class="arrow-lbl">silence, exit</text>
  <line class="arrow" x1="730" y1="280" x2="606" y2="380" marker-end="url(#arrow)"/>
  <text x="700" y="346" class="arrow-lbl">silence, exit</text>
  <path class="arrow" d="M 960 280 V 488 H 120 V 284" marker-end="url(#arrow)"/>
  <text x="800" y="480" class="arrow-lbl">next wait</text>
  <text x="550" y="524" class="col-sub">a lost worker is replaced; its task goes to a successor exactly once</text>
</svg>
