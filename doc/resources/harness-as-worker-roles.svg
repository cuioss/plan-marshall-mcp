<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: block; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Worker roles: warm, fresh, and configured per role</title>
  <desc id="desc">The left column lists the warm workers kept while there is work: a planning agent per running plan, project triage, and code triage. The middle column lists the fresh workers started for one task: outline, planning, coding, the reviews, with the self-review split in two, and the screener of untrusted text. The right column shows how every role is typed and configured, with an example assignment of harnesses.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="36" y="98" class="txt-b">planning agent</text>
  <text x="36" y="118" class="txt">per running plan: re-planning</text>
  <text x="356" y="98" class="txt-b">outline</text>
  <text x="356" y="118" class="txt">first layout of a plan</text>
  <text x="676" y="98" class="txt-b">type</text>
  <text x="676" y="118" class="txt">class and exact tool set</text>
  <text x="36" y="148" class="txt-b">project triage</text>
  <text x="36" y="168" class="txt">decision points, unmapped</text>
  <text x="36" y="188" class="txt">build and CI results</text>
  <text x="356" y="148" class="txt-b">planning</text>
  <text x="356" y="168" class="txt">tasks from the outline</text>
  <text x="676" y="148" class="txt-b">effort level</text>
  <text x="676" y="168" class="txt">per role</text>
  <text x="36" y="218" class="txt-b">code triage</text>
  <text x="36" y="238" class="txt">code, PR, Sonar findings</text>
  <text x="356" y="218" class="txt-b">coding</text>
  <text x="356" y="238" class="txt">writer, one per plan</text>
  <text x="676" y="218" class="txt-b">harness and model</text>
  <text x="676" y="238" class="txt">per role</text>
  <text x="356" y="268" class="txt-b">reviews</text>
  <text x="356" y="288" class="txt">security, simplify,</text>
  <text x="356" y="308" class="txt">self-review: requirement fit,</text>
  <text x="356" y="328" class="txt">self-review: code correctness</text>
  <text x="356" y="358" class="txt-b">screener</text>
  <text x="356" y="378" class="txt">untrusted text, zero tools</text>
  <text x="676" y="268" class="txt">for example:</text>
  <text x="676" y="288" class="txt">main thread, planning: OpenCode</text>
  <text x="676" y="308" class="txt">coding: Claude Code</text>
  <text x="676" y="328" class="txt">reviews: Claude Code</text>
  <text x="140" y="28" class="col-header">warm workers</text>
  <rect class="stroke" x="20" y="44" width="240" height="388" rx="6" ry="6"/>
  <text x="140" y="70" class="col-sub">kept while there is work</text>
  <text x="140" y="416" class="col-sub">supervised, recycled when idle</text>
  <text x="460" y="28" class="col-header">fresh workers</text>
  <rect class="stroke" x="340" y="44" width="240" height="388" rx="6" ry="6"/>
  <text x="460" y="70" class="col-sub">one task, then end</text>
  <text x="460" y="416" class="col-sub">never waits idle</text>
  <text x="780" y="28" class="col-header">configuration</text>
  <rect class="stroke" x="660" y="44" width="240" height="388" rx="6" ry="6"/>
  <text x="780" y="70" class="col-sub">per role, project, or machine</text>
  <text x="780" y="416" class="col-sub">applies to every role</text>
  <line class="arrow" x1="264" y1="158" x2="336" y2="158" marker-end="url(#arrow)"/>
  <text x="300" y="150" class="arrow-lbl">consult</text>
  <line class="arrow" x1="336" y1="182" x2="264" y2="182" marker-end="url(#arrow)"/>
  <text x="300" y="200" class="arrow-lbl">through</text>
  <text x="300" y="212" class="arrow-lbl">the server</text>
  <line class="arrow" x1="656" y1="222" x2="584" y2="222" marker-end="url(#arrow)"/>
  <text x="620" y="202" class="arrow-lbl">types and</text>
  <text x="620" y="214" class="arrow-lbl">configures</text>
</svg>
