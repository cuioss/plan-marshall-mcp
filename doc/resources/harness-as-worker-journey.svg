<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: block; standards: pm-documents:ref-svg-diagrams -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 412"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">From the harness to the server: three steps of the control direction</title>
  <desc id="desc">Three columns compare plan-marshall, the first PM-MCP design, and the harness as worker: who drives a plan, where its state lives, how model work is started, and how long a plan lives. The process logic moves to the server in the second step; the control direction moves in the third.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .encl       { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub   { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .txt        { font-size: 12px; fill: #6e7681; }
      .txt-c      { font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .txt-b      { font-size: 12px; fill: #6e7681; font-weight: 600; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .mount      { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .arrow-lbl  { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-hub { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .tint       { fill: #6e7681; opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .lifeline   { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .own-bar    { stroke: #6e7681; stroke-width: 3; }
      .mount-stem { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 2 2; }
      .boundary   { stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .dot        { fill: #6e7681; }
    </style>
  </defs>
  <text x="36" y="98" class="txt-b">drives</text>
  <text x="36" y="118" class="txt">the model in the session</text>
  <text x="356" y="98" class="txt-b">drives</text>
  <text x="356" y="118" class="txt">the interactive session,</text>
  <text x="356" y="138" class="txt">by following links</text>
  <text x="676" y="98" class="txt-b">drives</text>
  <text x="676" y="118" class="txt">pm-mcpd</text>
  <text x="36" y="168" class="txt-b">state</text>
  <text x="36" y="188" class="txt">files written by scripts</text>
  <text x="36" y="208" class="txt">that the model runs</text>
  <text x="356" y="168" class="txt-b">state</text>
  <text x="356" y="188" class="txt">server stores and transitions</text>
  <text x="676" y="168" class="txt-b">state</text>
  <text x="676" y="188" class="txt">server stores and transitions</text>
  <text x="36" y="238" class="txt-b">model work</text>
  <text x="36" y="258" class="txt">sub-agents dispatched</text>
  <text x="36" y="278" class="txt">by the model itself</text>
  <text x="356" y="238" class="txt-b">model work</text>
  <text x="356" y="258" class="txt">server-launched jobs, plus</text>
  <text x="356" y="278" class="txt">52 link states in the session</text>
  <text x="676" y="238" class="txt-b">model work</text>
  <text x="676" y="258" class="txt">supervised workers that pull</text>
  <text x="676" y="278" class="txt">tasks, warm or fresh</text>
  <text x="36" y="308" class="txt-b">a plan lives</text>
  <text x="36" y="328" class="txt">as long as the session</text>
  <text x="356" y="308" class="txt-b">a plan lives</text>
  <text x="356" y="328" class="txt">as long as a session calls</text>
  <text x="676" y="308" class="txt-b">a plan lives</text>
  <text x="676" y="328" class="txt">independently of any session</text>
  <text x="140" y="28" class="col-header">plan-marshall</text>
  <rect class="stroke" x="20" y="44" width="240" height="348" rx="6" ry="6"/>
  <text x="140" y="70" class="col-sub">everything in the harness</text>
  <text x="140" y="376" class="col-sub">guarantees rest on prose</text>
  <text x="460" y="28" class="col-header">first PM-MCP design</text>
  <rect class="stroke" x="340" y="44" width="240" height="348" rx="6" ry="6"/>
  <text x="460" y="70" class="col-sub">the process in the server</text>
  <text x="460" y="376" class="col-sub">a plan waits for its session</text>
  <text x="780" y="28" class="col-header">harness as worker</text>
  <rect class="stroke" x="660" y="44" width="240" height="348" rx="6" ry="6"/>
  <text x="780" y="70" class="col-sub">the server drives</text>
  <text x="780" y="376" class="col-sub">the model only follows links</text>
  <line class="arrow" x1="264" y1="172" x2="336" y2="172" marker-end="url(#arrow)"/>
  <text x="300" y="152" class="arrow-lbl">process moves</text>
  <text x="300" y="164" class="arrow-lbl">to the server</text>
  <line class="arrow" x1="584" y1="242" x2="656" y2="242" marker-end="url(#arrow)"/>
  <text x="620" y="222" class="arrow-lbl">control moves</text>
  <text x="620" y="234" class="arrow-lbl">to the server</text>
</svg>
